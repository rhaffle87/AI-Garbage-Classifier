name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 bandit
      - name: Run Black
        run: black --check app/ scripts/ tests/
      - name: Run Flake8
        run: flake8 app/ scripts/ tests/ --count --select=E9,F63,F7,F82,F401,E402,F541 --show-source --statistics
      - name: Run Bandit Security Scan
        run: bandit -r app/ scripts/ -c bandit.yaml

  tests:
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/
